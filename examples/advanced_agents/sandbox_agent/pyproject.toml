[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]

[tool.setuptools_scm]
git_describe_command = "git describe --long --first-parent"
root = "../../.."

[project]
name = "nat_sandbox_agent"
dynamic = ["version"]
dependencies = [
    # NAT core with sandbox support
    "nvidia-nat[sandbox]~=1.5",

    # Web search (runs on host, API key not exposed to sandbox)
    "tavily-python>=0.5.0",
]
requires-python = ">=3.11,<3.14"
description = "Sandbox Agent - A general-purpose agent with sandboxed execution capabilities for NAT"
readme = "README.md"
classifiers = ["Programming Language :: Python"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[tool.uv.sources]
nvidia-nat = { path = "../../..", editable = true }

# NAT component entry point - this registers the workflow
[project.entry-points.'nat.components']
nat_sandbox_agent = "nat_sandbox_agent.register"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.pytest_asyncio]
asyncio_mode = "auto"
