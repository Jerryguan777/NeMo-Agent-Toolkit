# =============================================================================
# Sandbox Agent - GAIA Benchmark Evaluation Configuration
# =============================================================================
#
# Uses NAT's native react_agent with sandbox tools for GAIA evaluation.
#
# Usage Examples (run from sandbox_agent directory):
#
#   1. Run with default settings (Level 1, NIM LLaMA):
#      nat eval --config_file configs/config_gaia.yaml
#
#   2. Run specific level:
#      GAIA_LEVEL=2 nat eval --config_file configs/config_gaia.yaml
#      GAIA_LEVEL=3 nat eval --config_file configs/config_gaia.yaml
#
#   3. Run with OpenAI model:
#      LLM_TYPE=openai LLM_MODEL=gpt-4o nat eval --config_file configs/config_gaia.yaml
#
#   4. Run with custom output directory:
#      EVAL_OUTPUT_DIR=.tmp/my_eval/ nat eval --config_file configs/config_gaia.yaml
#
# Environment Variables:
#   - GAIA_LEVEL: GAIA difficulty level (1, 2, or 3). Default: 1
#   - LLM_TYPE: LLM provider type (nim or openai). Default: nim
#   - LLM_MODEL: Model name. Default: meta/llama-3.3-70b-instruct
#   - EVAL_OUTPUT_DIR: Output directory. Default: .tmp/nat/sandbox_agent/gaia_eval/
#   - MAX_CONCURRENCY: Parallel evaluation tasks. Default: 4
#   - MAX_ITERATIONS: Max agent iterations per task. Default: 50
#
# Required Environment Variables:
#   - NVIDIA_API_KEY or NGC_API_KEY: For NIM LLM access
#   - OPENAI_API_KEY: For OpenAI models
#   - TAVILY_API_KEY: For web search tool
#
# =============================================================================

# LLM Configuration
llms:
  agent_llm:
    _type: ${LLM_TYPE:-nim}
    model_name: ${LLM_MODEL:-meta/llama-3.3-70b-instruct}
    temperature: 0.0
    max_tokens: 8192

  eval_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.0

# Sandbox Configuration
sandboxes:
  code_sandbox:
    _type: docker
    image: "nat-sandbox:latest"
    memory_limit: "4g"
    cpu_limit: 4.0
    network_enabled: true
    # Mount GAIA attachments directory to sandbox
    volumes:
      "./data/attachments":
        bind: "/workspace/input"
        mode: "rw"

# Function Configuration
function_groups:
  sandbox_tools:
    _type: sandbox_tools
    sandbox_name: code_sandbox
    max_output_chars: 20000
    include_tools: [shell, python, file_read, file_write, web_browse]

functions:
  web_search:
    _type: web_search
    max_results: 5

# Workflow Configuration - NAT's native ReAct agent
workflow:
  _type: react_agent
  llm_name: agent_llm
  tool_names:
    - sandbox_tools
    - web_search
  max_iterations: ${MAX_ITERATIONS:-50}
  # Use additional_instructions to customize behavior while keeping the ReAct format
  additional_instructions: |
    You are solving GAIA benchmark tasks with access to an isolated sandbox environment
    where you can execute code, browse the web, and manipulate files.

    ## Sandbox Environment
    - /workspace/input - Attached files are here (check this first!)
    - /workspace/output - Save generated outputs here
    - /workspace/temp - Temporary files
    - The sandbox has internet access for web browsing and downloads.

    ## CRITICAL RULES - YOU MUST FOLLOW THESE

    ### MANDATORY Tool Usage
    1. NEVER guess or calculate in your head - ALWAYS use `sandbox_tools__python` for ANY calculation, even simple arithmetic.
    2. NEVER make assumptions about facts - ALWAYS use `web_search` or `sandbox_tools__web_browse` to verify information.
    3. NEVER guess file contents - ALWAYS use `sandbox_tools__file_read` to examine files before answering questions about them.
    4. Check /workspace/input FIRST - If a question mentions "attached file", "spreadsheet", "PDF", or "image", the file is likely in /workspace/input. Use `sandbox_tools__shell` with `ls -la /workspace/input` to see available files.

    ### Tool Selection
    - System operations (ls, cp, mv, pip install, curl, wget): Use `sandbox_tools__shell`
    - Data processing, calculations, file parsing (pandas, numpy, JSON, CSV, Excel): Use `sandbox_tools__python`
    - Read/write files: Use `sandbox_tools__file_read` / `sandbox_tools__file_write`
    - Web research: Use `web_search` first, then `sandbox_tools__web_browse` for details
    - Browse specific URLs: Use `sandbox_tools__web_browse`

    ### Problem-Solving Strategy
    - Break down complex tasks into smaller steps. Execute commands one at a time and verify results.
    - Handle errors gracefully. If a command fails, analyze the error and try alternative approaches.
    - Be thorough. If the first approach doesn't work, try multiple methods before giving up.

    ### Answer Format Requirements - VERY IMPORTANT
    - Provide ONLY the final answer - Do not include explanations, reasoning, or phrases like "The answer is..."
    - Match the expected format exactly:
      - Numbers: Just the number (e.g., "42" not "42 meters" or "The answer is 42")
      - Names: Just the name (e.g., "Albert Einstein" not "The person is Albert Einstein")
      - Yes/No questions: Just "yes" or "no"
      - Lists: Comma-separated values (e.g., "a, b, c")
    - Verify your answer before responding. Double-check calculations and facts.

# Evaluation Configuration
eval:
  general:
    output_dir: ${EVAL_OUTPUT_DIR:-.tmp/nat/sandbox_agent/gaia_eval/}
    max_concurrency: ${MAX_CONCURRENCY:-4}
    dataset:
      _type: parquet
      file_path: hf://datasets/gaia-benchmark/GAIA/2023/validation/metadata.parquet
      id_key: task_id
      structure:
        question_key: Question
        answer_key: "Final answer"
      filter:
        allowlist:
          field:
            Level: ["${GAIA_LEVEL:-1}"]

  evaluators:
    accuracy:
      _type: ragas
      metric: AnswerAccuracy
      llm_name: eval_llm

    runtime:
      _type: avg_workflow_runtime

    llm_latency:
      _type: avg_llm_latency

    llm_calls:
      _type: avg_num_llm_calls
